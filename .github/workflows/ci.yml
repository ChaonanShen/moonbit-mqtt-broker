name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      soak:
        description: Run the ten-minute extended stability profile
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && format('formal-{0}', github.run_id) || (github.head_ref || github.ref_name) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  release-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Linux x86_64 toolchain
        run: docker build --platform linux/amd64 --tag moonbit-mqtt-broker-dev .
      - name: Verify committed package and isolated runtime dependencies
        run: |
          if [[ "${{ github.event.inputs.soak }}" == "true" ]]; then
            export RELEASE_SOAK=1
          fi
          scripts/verify-distribution-docker.sh
      - name: Stage safe distribution evidence
        if: always()
        run: |
          sudo python3 -B tools/stage_distribution_evidence.py \
            test-results/distribution test-results/distribution-upload
      - name: Upload distribution evidence and tested package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-evidence
          path: test-results/distribution-upload/**
          if-no-files-found: warn
          retention-days: 30
